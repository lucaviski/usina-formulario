<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registro de Campo — Usina</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A; --panel:#1B1E23; --panel-2:#20242A; --border:#2B3038; --border-soft:#242830;
    --text:#EDEEF0; --muted:#8B909A; --muted-2:#5F6570;
    --amber:#E8A33D; --amber-dim:#4A3A1E; --teal:#4FB286; --teal-dim:#1B3A2E; --rust:#E1573A; --rust-dim:#402019;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3F2EE; --panel:#FFFFFF; --panel-2:#F8F7F4; --border:#DEDCD5; --border-soft:#E7E5DF;
      --text:#181A1D; --muted:#5C6068; --muted-2:#8A8E96; --amber-dim:#FBE6C4; --teal-dim:#DCF0E6; --rust-dim:#FBDFD9;
    }
  }
  :root[data-theme="light"]{
    --bg:#F3F2EE; --panel:#FFFFFF; --panel-2:#F8F7F4; --border:#DEDCD5; --border-soft:#E7E5DF;
    --text:#181A1D; --muted:#5C6068; --muted-2:#8A8E96; --amber-dim:#FBE6C4; --teal-dim:#DCF0E6; --rust-dim:#FBDFD9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:24px; }

  header{ padding:16px 16px 10px; }
  .brand{ font-family:var(--font-display); font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--amber); flex:none; }
  .sync-status{ font-size:11px; color:var(--muted-2); margin-top:3px; font-family:var(--font-mono); padding-left:17px; }
  .sync-status.pend{ color:var(--amber); }
  .sync-status.err{ color:var(--rust); }

  .switcher{ display:flex; gap:6px; padding:2px 16px 14px; }
    };

    var btn = document.getElementById("btn-submit-compra");
    btn.disabled = true;
    var synced = false;
    if(dbReady){
      try{ await dbNs.collection("compras").doc(rec.id).set(rec); synced = true; }catch(err){ synced = false; }
    } else {
      synced = await enviarParaPlanilha("compras", rec);
    }
    if(synced){ syncedTodayCompras.unshift(rec); }
    else{ pendCompras.unshift(rec); lsSet("campo_pend_compras", pendCompras); }
    btn.disabled = false;

    showOverlay("Compra salva", synced ? (dbReady ? "Sincronizado com a equipe." : "Enviado pra planilha.") : "Salvo neste aparelho — sincroniza sozinho quando houver sinal.");
    setSyncStatus();
    renderToday();
    atualizarEstoqueDisplay();

    var dd = rec.data.split("-");
    comprasAbertas.push({ id: rec.id, data: dd[2]+"/"+dd[1], fornecedor: rec.fornecedor, material: rec.material, valor: rec.valor,
      recebido: 0, contratado: rec.qtdContratada || null, situacao: "Sem par", _local: true });
    renderCompraSelect();
    document.getElementById("c-valor").value = "";
    document.getElementById("c-qtd").value = "";
    document.getElementById("c-documento").value = "";
    document.getElementById("c-obs").value = "";
  });

  // ---------- init misc ----------
  var lastResp = lsGet("campo_last_resp", "");
  if(lastResp) document.getElementById("e-resp").value = lastResp;
  updateHoras();
  updateTracoReadout();
  setSyncStatus();
  initDb();
  setInterval(flushPending, 20000);
  setInterval(flushPendingSheet, 20000);
})();
</script>
</body>
</html>
